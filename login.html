<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ログイン｜日本信達 株主専用ポータル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<main class="narrow">
<p class="eyebrow">SHAREHOLDER PORTAL</p>
<h1>株主専用ポータル</h1>
<p>本ポータルは、当社の株主の皆様に限ってご覧いただけます。ご案内した合言葉を入力してください。</p>
<p class="err" id="err" hidden></p>
<form class="gate" method="post" action="/auth">
  <input type="hidden" name="kind" value="portal">
  <div class="field"><label for="passphrase">合言葉</label><input id="passphrase" name="passphrase" type="password" required autocomplete="off"></div>
  <div class="panel">
    <p><b>利用条件</b></p>
    <p class="note">1　掲載情報を第三者に開示・転送しません。<br>2　将来予測に関する記述は現時点の判断であり、実際の結果と異なる場合があることを確認しました。<br>3　本ポータルは情報提供を目的とし、投資勧誘を目的としないことを理解しました。</p>
    <label class="check" for="agree"><input id="agree" name="agree" type="checkbox" value="yes" required><span>上記の利用条件に同意します</span></label>
  </div>
  <button type="submit">同意してログイン</button>
</form>
<p class="note" style="margin-top:28px">ログインの方式は検討中です。この画面は合言葉による仮の方式です。</p>
<script>
const e = new URLSearchParams(location.search).get('e');
const el = document.getElementById('err');
if (e === '1') { el.textContent = '合言葉が違います。もう一度入力してください。'; el.hidden = false; }
if (e === '2') { el.textContent = '利用条件への同意が必要です。チェックを入れてください。'; el.hidden = false; }
</script>
</main>
</body>
</html>
